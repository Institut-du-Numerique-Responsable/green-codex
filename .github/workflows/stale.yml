name: Mark stale issues and PRs

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been inactive for 30 days. 
            If you still need help, please leave a comment or we will close this issue in 7 days.
          close-issue-message: |
            This issue has been closed due to inactivity. 
            Feel free to reopen if you still need help.
          
          # Pull Requests
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: |
            This PR has been inactive for 60 days. 
            If you still want it to be reviewed, please leave a comment or we will close this PR in 14 days.
          close-pr-message: |
            This PR has been closed due to inactivity. 
            Feel free to reopen if you still want it to be reviewed.
          
          # Exemptions
          exempt-issue-labels: 'pinned,help-wanted,good-first-issue,security'
          exempt-pr-labels: 'pinned,work-in-progress,do-not-merge'
          
          # Only for issues/PRs in the main repo (not forks)
          only-labels: false
