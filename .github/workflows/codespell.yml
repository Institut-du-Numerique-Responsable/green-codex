name: Check Spelling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install codespell
        run: pip install codespell
        
      - name: Run codespell
        run: |
          codespell \
            --skip '*.min.*' \
            --check-filenames \
            --check-hidden \
            --ignore-words .codespell-ignore \
            .
        
      - name: Check for misspellings
        run: |
          if [ $(codespell --count) -gt 0 ]; then
            echo "Spelling errors found!"
            codespell --skip '*.min.*' --check-filenames --check-hidden
            exit 1
          else
            echo "No spelling errors found."
          fi
