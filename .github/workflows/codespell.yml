name: Check Spelling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install codespell
        run: pip install codespell
        
      - name: Run codespell
        run: |
          git ls-files -z | xargs -0 codespell \
            --skip '*.min.*' \
            --check-filenames \
            --check-hidden \
            --ignore-words .codespell-ignore
