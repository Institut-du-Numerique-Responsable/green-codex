name: Check Markdown Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Install markdown-link-check
        run: npm install -g markdown-link-check
        
      - name: Run markdown-link-check
        run: |
          find . -type f -name '*.md' -print0 | xargs -0 -n1 markdown-link-check --quiet --config .markdown-link-check.json
